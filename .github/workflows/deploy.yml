name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The action commits the site to the gh-pages branch, so it needs write access.
permissions:
  contents: write

# Never let two deploys race for the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          # Repo-only files that should not be served by the site.
          exclude_assets: '.github,.gitignore'
          # Keep a single commit on gh-pages instead of piling up deploy history.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
